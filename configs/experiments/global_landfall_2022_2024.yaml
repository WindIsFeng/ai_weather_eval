experiment:
  name: global_coastal_impact_2022_2024
  description: Global hurricane-strength tropical cyclones with coastal wind exposure during 2022-2024
  output_root: outputs

period:
  basis: closest_approach_time
  start: 2022-01-01T00:00:00Z
  end: 2024-12-31T23:59:59Z

case_selection:
  best_track_dataset: ibtracs
  coastline_dataset: gshhg
  intensity_source: USA_WIND
  coordinate_source: [LAT, LON]
  distance_ellipsoid: WGS84
  land_sea_classification: gshhg_level1_polygon
  wind_radius_contact_requires_sea_center: true
  crossing_direction: sea_to_land_only
  coastal_peak_threshold_kt: 64
  missing_radius_distance_km: 100
  episode_gap_hours: 6
  intensity_window_hours: 6
  maximum_track_gap_hours: 6
  maximum_track_sample_spacing_km: 10
  maximum_time_step_hours: 1
  distance_candidate_samples: 6
  crossing_candidate_samples: 16
  primary_tiers: [A, B]
  case_unit: coastal_contact_episode
  include_islands: true
  minimum_island_area_km2: 0
  retain_extratropical_and_post_tropical: true
  manual_qc_overrides: ${AI_WEATHER_EVAL_DATA}/interim/case_catalog/qc_overrides.yaml

forecast_sampling:
  nominal_lead_hours: [24, 48, 72, 96, 120]
  standard_cycle_hours_utc: [0, 6, 12, 18]
  maximum_cycle_offset_hours: 3
  primary_comparison_sample: common_model_intersection

models:
  - pangu_weather
  - fengwu
  - fuxi
  - graphcast
  - aurora

verification:
  track_metrics: [position_error, along_track_error, cross_track_error]
  intensity_metrics: [vmax_bias, vmax_mae, vmax_rmse, mslp_bias, mslp_mae, mslp_rmse]
  landfall_metrics: [hit, time_error, position_error, vmax_error, mslp_error]
  field_variables: [msl, u10, v10, z500, u850, v850, u200, v200]
  field_metrics: [bias, rmse, anomaly_correlation]
  field_frames: [earth_relative, storm_centered]
  common_grid_degrees: 0.25

statistics:
  aggregation_dimensions: [model, basin, year, nominal_lead_hours]
  cluster_unit: storm_id
  bootstrap_replicates: 1000
  confidence_level: 0.95
  random_seed: 20220801
